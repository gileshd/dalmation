unbind ^A
bind ^A select-pane -t :.+

# checks for genomics window and opens one if not available
set -s command-alias[100] genomics="new-window -n script -t 99 ~/.tmux/genomics.sh"
set -s command-alias[101] gen_notebook="new-window -n script -t 99 ~/.tmux/gen-notebook.sh"

# Nord colorscheme
